<text x="80" y="588" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#1c2a33" text-anchor="start">Loop  (generate → critic → revise)</text>
<text x="50" y="610" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#55636c" text-anchor="start">an agent&#x27;s work is judged by a CRITIC agent; revise until it passes — or a hard cap fires.</text>
<text x="50" y="628" font-family="Segoe UI, Arial, sans-serif" font-size="10.6" font-weight="700" fill="#2b8a78" text-anchor="start">D2M: draft BOM → critic checks feasibility → revise   ·   the loop-breaker WITH TEETH</text>
