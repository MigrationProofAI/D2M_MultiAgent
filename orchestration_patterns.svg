<text x="30" y="38" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="800" fill="#1c2a33" text-anchor="start">D2M Test Rig — Agentic Orchestration Patterns</text>
<text x="30" y="60" font-family="Segoe UI, Arial, sans-serif" font-size="12.5" font-weight="normal" fill="#6a7882" text-anchor="start">the four shapes the Conductor composes agents into  ·  agents stay inside their authority boundaries — the Conductor only decides the SHAPE  ·  every shape reuses ONE primitive: an agent = run_turn + isolated memory</text>
<rect x="30" y="86" width="722" height="452" rx="12" fill="#ffffff" stroke="#dcd8d0" stroke-width="1.5"/>
<text x="50" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800" fill="#b3ada1" text-anchor="start">1</text>
<text x="80" y="116" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="800" fill="#1c2a33" text-anchor="start">Sequential  (baton pass)</text>
<text x="50" y="138" font-family="Segoe UI, Arial, sans-serif" font-size="11" font-weight="normal" fill="#55636c" text-anchor="start">each agent&#x27;s OUTPUT becomes the next agent&#x27;s INPUT. one lane, in order.</text>
<text x="50" y="156" font-family="Segoe UI, Arial, sans-serif" font-size="10.6" font-weight="700" fill="#2b8a78" text-anchor="start">D2M: Material → BOM → Routing → Planning   (this is run_genesis — already exists)</text>
